{% extends "base.html" %}
{% block titulo %}Nova Transação{% endblock %}

{% block header_acao_mobile %}
<a href="/" style="color:var(--beje-escuro); text-decoration:none; font-size:0.9rem;">
    <i class="bi bi-x-lg"></i>
</a>
{% endblock %}

{% block conteudo %}
<div class="container" style="max-width: 600px;">
    <div class="py-3">
        <h5 class="fw-bold mb-4" style="font-family:'Syne',sans-serif; letter-spacing:-1px;">
            <i class="bi bi-plus-circle me-2" style="color:var(--vinho-claro);"></i>Nova Transação
        </h5>

        <form method="POST" action="{{ url_for('transacoes.adicionar') }}">
            <!-- Tipo: gasto ou receita -->
            <div class="mb-3">
                <label class="form-label">Tipo</label>
                <div class="btn-group w-100" role="group">
                    <input type="radio" class="btn-check" name="tipo" id="tipo-gasto"
                           value="gasto" checked>
                    <label class="btn btn-outline-danger" for="tipo-gasto">
                        <i class="bi bi-arrow-up-circle me-1"></i>Gasto
                    </label>

                    <input type="radio" class="btn-check" name="tipo" id="tipo-receita"
                           value="receita">
                    <label class="btn btn-outline-success" for="tipo-receita">
                        <i class="bi bi-arrow-down-circle me-1"></i>Receita
                    </label>
                </div>
            </div>

            <!-- Valor -->
            <div class="mb-3">
                <label class="form-label" for="valor">Valor (R$)</label>
                <div class="input-group input-group-lg">
                    <span class="input-group-text">R$</span>
                    <input type="number"
                           id="valor"
                           name="valor"
                           class="form-control form-control-lg"
                           placeholder="0,00"
                           inputmode="decimal"
                           step="0.01"
                           min="0.01"
                           autofocus
                           required>
                </div>
            </div>

            <!-- Descrição -->
            <div class="mb-3">
                <label class="form-label" for="descricao">Descrição</label>
                <input type="text"
                       id="descricao"
                       name="descricao"
                       class="form-control"
                       placeholder="Ex: Mercado Extra, Conta de luz, Salário..."
                       maxlength="200"
                       required>
            </div>

            <!-- Categoria -->
            <div class="mb-3">
                <label class="form-label" for="categoria_id">Categoria</label>
                <select id="categoria_id" name="categoria_id" class="form-select" required>
                    <option value="" disabled selected>Selecione uma categoria</option>
                    {% for categoria in categorias %}
                        <option value="{{ categoria.id }}"
                                data-cartao="{{ 'true' if categoria.eh_cartao_credito else 'false' }}">
                            {{ categoria.nome }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Data -->
            <div class="mb-3">
                <label class="form-label" for="data_transacao">Data</label>
                <input type="date"
                       id="data_transacao"
                       name="data_transacao"
                       class="form-control"
                       value="{{ hoje.isoformat() }}"
                       required>
            </div>

            <!-- É cartão Santander? -->
            <div class="mb-3">
                <div class="form-check form-switch">
                    <input class="form-check-input"
                           type="checkbox"
                           id="eh_cartao_credito"
                           name="eh_cartao_credito">
                    <label class="form-check-label" for="eh_cartao_credito">
                        <i class="bi bi-credit-card me-1" style="color:var(--vinho-claro);"></i>
                        Compra no Cartão Santander
                    </label>
                </div>
                <div class="form-text">
                    Marcado automaticamente ao escolher a categoria "Cartão Santander".
                </div>
            </div>

            <!-- Observações (opcional) -->
            <div class="mb-4">
                <label class="form-label" for="observacoes">
                    Observações <span style="color:var(--beje-escuro); font-weight:400;">(opcional)</span>
                </label>
                <textarea id="observacoes"
                          name="observacoes"
                          class="form-control"
                          rows="2"
                          placeholder="Detalhes adicionais..."
                          maxlength="500"></textarea>
            </div>

            <!-- Botões -->
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-check-lg me-2"></i>Salvar
                </button>
                <a href="/" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts_extras %}
<script>
document.getElementById("categoria_id").addEventListener("change", function() {
    const opcaoSelecionada = this.options[this.selectedIndex];
    const ehCartao = opcaoSelecionada.dataset.cartao === "true";
    document.getElementById("eh_cartao_credito").checked = ehCartao;
});
</script>
{% endblock %}
